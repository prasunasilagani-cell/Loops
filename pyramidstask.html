<!DOCTYPE html>
<html lang="en">

    <title>Document</title>

<style>
    body{
        display: grid;
        grid-template-columns: repeat(5,1fr);

<body>
    <div>
        <script>
//     1
//    222
//   33333
//  4444444
// 555555555          
          for(i=1;i<=5;i++){
            for(j=5;j>=i;j--){
                document.write("&nbsp;&nbsp;")
            }
            for(k=1;k<=i;k++){
                document.write(i)
            }
            for(l=2;l<=i;l++){
                document.write(i)
            }
            document.write("<br>")
          }
        </script>
    </div>

                    document.write(m)
                }
                for(p=1;p<=m-1;p++){

                }

            }
